<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Data - Hub</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/device-gate.js"></script>
  <script type="module" src="/assets/js/sidebar.js"></script>
  <script type="module" src="/materials/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar material material-thick" id="sidebar"></aside>
    <main class="app-main" id="main" tabindex="-1">
      <header class="toolbar material material-thick">
        <button class="icon-btn nav-toggle" type="button" data-action="toggle-nav"
                aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
          <svg class="icon icon-md" aria-hidden="true"><use href="/assets/icons/sprite.svg#panel-left"></use></svg>
        </button>
        <div class="toolbar-title">
          <h1 class="text-headline" id="mt-title">Data</h1>
          <p class="text-footnote text-secondary" id="mt-sub"></p>
        </div>
        <div class="toolbar-actions mm-actions">
          <button class="btn btn-gray btn-sm mm-stars-btn" type="button" id="mm-stars" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.5l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg>
            <span>Engineer picks</span>
          </button>
        </div>
      </header>
      <div class="page mt-page" id="mt-view">
        <section class="card mm-card" aria-label="Mindmap">
          <svg class="mm-map" id="mm-map" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Mindmap" preserveAspectRatio="xMidYMin meet"></svg>
          <ul class="mm-legend" role="list">
            <li><svg viewBox="0 0 24 24" class="mm-legend-star" aria-hidden="true"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.5l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg>Key for software engineers and architects</li>
            <li><span class="mm-legend-dot"></span>S2 prep: a bridge from S1 toward S2</li>
            <li><span class="mm-legend-badge">Stats</span>Linked to another map</li>
            <li><span class="mm-legend-ref"></span>Reference to a topic owned by another map</li>
            <li class="mm-legend-hint">Hover a node to read what it is</li>
          </ul>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
