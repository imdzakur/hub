<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home - Hub</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/device-gate.js"></script>
  <script type="module" src="/assets/js/sidebar.js"></script>
  <script type="module" src="/assets/js/home.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar material material-thick" id="sidebar"></aside>
    <main class="app-main" id="main" tabindex="-1">
      <header class="toolbar material material-thick">
        <button class="icon-btn nav-toggle" type="button" data-action="toggle-nav"
                aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
          <svg class="icon icon-md" aria-hidden="true"><use href="/assets/icons/sprite.svg#panel-left"></use></svg>
        </button>
        <div class="toolbar-title">
          <p class="text-headline">Home</p>
        </div>
      </header>
      <div class="page home-page">
        <header class="home-hero">
          <p class="home-date" id="home-date"></p>
          <h1 class="text-large-title strong" id="home-greeting">Welcome</h1>
        </header>

        <section class="home-block" aria-labelledby="overview-title">
          <h2 class="visually-hidden" id="overview-title">Overview</h2>
          <ul class="stat-grid" role="list" id="home-stats"></ul>
        </section>

        <section class="home-block" aria-labelledby="apps-title">
          <h2 class="text-title-3 strong home-block-title" id="apps-title">Apps</h2>
          <div class="app-cards" id="home-apps"></div>
        </section>

        <div class="home-lists" id="home-lists"></div>
      </div>
    </main>
  </div>
</body>
</html>
